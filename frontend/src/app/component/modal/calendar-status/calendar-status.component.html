<div class="flex flex-col h-full">
    <div
        class="modal-header w-full shrink-0 bg-green flex justify-between items-center px-8  py-4">
        <div class="header-info flex flex-row items-center gap-3  flex-wrap">
            <div
                class="header-icon flex items-center justify-center w-[24px] h-[24px] shrink-0 rounded-full border-2 border-white !text-white">
                <mat-icon
                    style="display:flex;align-items:center;justify-content:center;font-size:16px;width:16px;height:16px;line-height:16px">event</mat-icon>
            </div>
            <p>Date's Status</p>
        </div>
        <div class="flex justify-end">
            <button class="flex items-center text-center"
                (click)="dialogRef.close()" aria-label="Close dialog">
                <mat-icon aria-label="Close" class="text-white">close</mat-icon>
            </button>
        </div>
    </div>

    <div class="modal-body p-4 flex-1 overflow-y-auto">

        <div class="py-4">
            <div class="mb-0.5">
                <h3 class="text-lg font-bold text-green">{{ date_label }}</h3>
                <p class="text-sm text-gray-500 flex items-center gap-1.5 mt-1">
                    Currently
                    <span
                        class="inline-flex items-center gap-1 font-semibold text-text">
                        <mat-icon
                            style="font-size:16px;width:16px;height:16px;line-height:16px">{{
                            status_icon(current_status) }}</mat-icon>
                        {{ current_status }}
                    </span>
                </p>
            </div>

            <div
                class="relative w-full flex flex-col lg:flex-col lg:justify-between gap-5 mt-3">
                <div
                    class="grid gap-x-10 gap-y-4 md:grid-cols-2 lg:xl:2xl:grid-cols-3">

                    <div class="input-fields">
                        <label>Status</label>
                        <select [(ngModel)]="selected_status" name="status"
                            class="tr-select w-full py-2 px-4 shadow-md border border-border font-medium text-text rounded-lg cursor-pointer transition-colors duration-150 hover:bg-[#E6F1E6]">
                            <option *ngFor="let item of status"
                                [ngValue]="item.value">
                                {{ item.value }}
                            </option>
                        </select>
                    </div>

                </div>

                <p class="text-xs text-gray-500 flex items-start gap-1.5">
                    <mat-icon
                        style="font-size:16px;width:16px;height:16px;line-height:16px">info</mat-icon>
                    Marking this date as Holiday also labels every attendance
                    record on this date as Holiday.
                </p>

            </div>
        </div>

    </div>

    <div
        class="modal-footer shrink-0 w-full flex justify-end gap-3 px-8 py-4 border-t border-[#DCE8DC]">
        <button type="button" (click)="dialogRef.close()"
            class="btn px-4 py-2 rounded-10 text-sm font-semibold border border-[#DCE8DC] text-gray-600 hover:bg-[#F1F8F1]">
            Cancel
        </button>
        <button type="button" (click)="submit()"
            class="button-gold px-6 py-2 flex items-center text-sm font-semibold">
            Save
        </button>
    </div>
</div>
