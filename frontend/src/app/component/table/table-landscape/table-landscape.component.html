<div class="w-full border">
    <table class="w-full">
        <thead>
            <tr>
                <th *ngFor="let header of labels"
                    class="first-letter:uppercase text-green  ">{{ header }}</th>
            </tr>
        </thead>

        <tbody>
            <tr *ngFor="let item of paged_data; let i = index"
                [ngClass]="row_class(item, first_index + i)">
                <ng-container *ngFor="let header of labels">
                    <td>
                        <ng-container
                            *ngIf="header === 'actions' && actions; else defaultCell">
                            <ng-container
                                *ngTemplateOutlet="actions; context: { $implicit: item, index: first_index + i }"></ng-container>
                        </ng-container>
                        <ng-template #defaultCell>
                            {{ item[header] }}
                        </ng-template>
                    </td>
                </ng-container>
            </tr>
        </tbody>
    </table>
    <div class="tbl-foot py-5 px-4 ">
        <div class="foot-info">
            <label class="foot-label" for="page-size">Rows</label>
            <select id="page-size" class="sel-page" name="page_size"
                [ngModel]="page_size" (ngModelChange)="change_page_size($event)">
                <option *ngFor="let size of page_size_options" [ngValue]="size">
                    {{ size }}
                </option>
            </select>
            <span id="recs-count">
                Showing {{ range_start }}-{{ range_end }} of {{ total }} records
            </span>
        </div>

        <div class="pagination" id="recs-pg">
            <button type="button" class="pg-btn" aria-label="Previous page"
                [disabled]="current_page === 1"
                (click)="go_to(current_page - 1)">&lsaquo;</button>

            <ng-container *ngFor="let page of pages">
                <span *ngIf="page === null; else pageButton" class="pg-gap"
                    aria-hidden="true">&hellip;</span>
                <ng-template #pageButton>
                    <button type="button" class="pg-btn"
                        [ngClass]="page === current_page ? 'active' : ''"
                        [attr.aria-current]="page === current_page ? 'page' : null"
                        (click)="go_to(page)">{{ page }}</button>
                </ng-template>
            </ng-container>

            <button type="button" class="pg-btn" aria-label="Next page"
                [disabled]="current_page === total_pages"
                (click)="go_to(current_page + 1)">&rsaquo;</button>
        </div>
    </div>

</div>
