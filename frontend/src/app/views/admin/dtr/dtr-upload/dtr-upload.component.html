<div class="w-full h-full flex flex-col gap-4">

  <app-dtr-banner [data]="filteredBanner" [view_number]="view_number_data" />

  <div class="lg:hidden">
    <div class="relative">
      <button type="button" (click)="dropdownOpen = !dropdownOpen"
        class="relative w-full flex items-center justify-between px-4 py-2.5 border rounded-10 bg-white text-sm font-medium text-green transition-colors"
        [ngClass]="dropdownOpen ? 'border-green ring-2 ring-green ring-opacity-20' : 'border-[#DCE8DC]'">
        <span class="flex items-center gap-2">
          {{ sections[activeTab].title }}
          <span *ngIf="get_section_error_count(activeTab) > 0"
            class="min-w-[16px] h-[16px] px-1 flex items-center justify-center rounded-full bg-red-500 text-white text-[10px] font-bold leading-none">
            {{ get_section_error_count(activeTab) }}
          </span>
        </span>
        <mat-icon class="transition-transform duration-200"
          [class.rotate-180]="dropdownOpen">expand_more</mat-icon>
      </button>

      <div *ngIf="dropdownOpen"
        class="absolute left-0 right-0 top-full mt-1 z-10 rounded-10 border border-[#DCE8DC] bg-white shadow-lg overflow-hidden">
        <button *ngFor="let section of sections; let i = index" type="button"
          (click)="selectTab(i)"
          class="relative w-full text-left px-4 py-2.5 text-sm"
          [ngClass]="activeTab === i ? 'bg-green text-white font-medium' : 'text-gray-700 hover:bg-[#F1F8F1]'">
          {{ section.title }}
          <span *ngIf="get_section_error_count(i) > 0"
            class="absolute top-1/2 -translate-y-1/2 right-3 min-w-[16px] h-[16px] px-1 flex items-center justify-center rounded-full bg-red-500 text-white text-[10px] font-bold leading-none">
            {{ get_section_error_count(i) }}
          </span>
        </button>
      </div>
    </div>
  </div>

  <input #fileInput type="file" accept=".xls,.xlsx" hidden
    (change)="onFileSelected($event)" />

  <div
    class="w-full h-full flex flex-col gap-4">
    @if (parser.employees.length === 0) {
    <div
      class="drop-zone w-full min-h-full flex flex-col items-center justify-center"
      [class.dragging]="isDragging()"
      (dragover)="onDragOver($event)" (dragleave)="isDragging.set(false)"
      (drop)="onDrop($event)"
      (click)="openFilePicker()">

      <mat-icon class="upload-icon">upload_file</mat-icon>
      <p class="text-base font-semibold !text-green">Drag & drop your DTR .xls
        file here</p>
      <span class="text-sm !text-green/70">or click to browse</span>

      @if (parser.isLoading) {
      <mat-icon class="upload-icon">hourglass_top</mat-icon>
      <p class="text-base font-semibold !text-green">Parsing file...</p>
      }
    </div>
    }

    <div
      class="bg-white rounded-xl shadow-md overflow-hidden border border-green/10">

      <div
        class="flex items-center justify-between gap-4 px-6 py-4 bg-green text-white">
        <div class="flex items-center gap-3">
          <mat-icon
            style="color:#eab308 ;font-size:20px;width:20px;height:20px;line-height:20px">assignment</mat-icon>
          <div>
            <h2
              class="text-base font-bold leading-tight text-white">{{file_name}}</h2>
            <p class="text-xs text-white/70">{{ parser.employees.length }}
              Record
              (s) Found</p>
          </div>
        </div>
        <div class="flex flex-row gap-4">
          <button mat-icon-button class="text-white" (click)="clearResults()">
            <mat-icon style="color:#fff">close</mat-icon>
          </button>

        </div>

      </div>
      <app-table-landscape [labels]="headers" [data]="parser.employees">
        <ng-container>
          <ng-template #actions let-default let-index="index">
            <div class="flex items-center py-2 ">

              <button
                class="text-blue-600 hover:text-opacity-80 font-bold text-sm ml-10"
                (click)="openModal(default, index)">
                Edit
              </button>
              <button (click)="remove_data(index)"
                class="text-red-600 hover:text-opacity-80 font-bold text-sm ml-10">
                Delete
              </button>
            </div>
          </ng-template>
        </ng-container>
      </app-table-landscape>

    </div>

    <div class="flex justify-end">
      <button (click)="submit()"
        class="inline-flex items-center gap-2 px-5 py-2 rounded-lg  font-medium
             bg-green text-white
             hover:bg-green-600 active:scale-95
             focus:outline-none focus:ring-2 focus:ring-green-400/50
             transition-all duration-150">
        Submit
      </button>
    </div>

  </div>
</div>
