<div class="w-full h-full flex flex-col gap-4">
    <app-breadcrumbs [data]="banner" [view_number]="new_number" />

    <div class="flex flex-row w-full gap-x-4">
        <div class="profile-panel flex flex-col w-[285px] h-full gap-y-3">
            <div
                class="flex flex-col items-center rounded-10 px-4 py-6 border-green-100 border-2 w-full h-auto bg-white shadow-md">
                <div class="profile-avatar shadow-md">{{ fname | slice:0:1 }}{{
                    lname | slice:0:1 }}</div>

                <div class="w-full flex flex-col gap-y-1">
                    <p
                        class="text-green text-sm font-bold items-center justify-center text-center">
                        {{ fname }}
                        {{ mname ? (mname | slice:0:1) + '.' : '' }}
                        {{ lname }}
                    </p>
                    <p
                        class=" text-sm  text-muted items-center justify-center text-center">
                        Employee ID: {{ employee_id }}
                    </p>
                    <p
                        class=" text-sm text-muted  items-center justify-center text-center">
                        Position: Doggy
                    </p>
                </div>
            </div>

            <div
                class="flex flex-col rounded-10 p-4 border-2 border-green-100 w-full h-[250px] bg-white shadow-md">

                <h3 class="text-green text-base font-bold mb-4">
                    Contact Details
                </h3>

                <div class="flex flex-col gap-4">

                    <div class="flex flex-col  ">
                        <span class="text-xs text-muted">Contact
                            Number</span>
                        <span
                            class="text-sm text-green font-medium">09**********</span>
                    </div>

                    <div class="flex flex-col ">
                        <span class="text-xs text-muted">Email</span>
                        <span
                            class="text-sm text-green font-medium">example
                        </span>
                    </div>

                    <div class="flex flex-col ">
                        <span class="text-xs text-muted">Address</span>
                        <span class="text-sm text-green font-medium">Sample
                            addres brgy. sample Sample city</span>
                    </div>

                </div>

            </div>
        </div>
        <div class="information-panel flex flex-col w-full h-full   gap-y-4">
            <app-admin-dashboard-card> </app-admin-dashboard-card>
            <div
                class="flex-1 min-h-0 bg-white rounded-10 shadow-md border border-border overflow-hidden">
                <div class="flex flex-col w-full  ">
                    <div
                        class="flex items-center justify-between  w-full flex-row  gap-2 py-4 px-4 ">

                        <div class="  relative  w-full  search-field">
                            <div
                                class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                                <mat-icon class="search-icon">search</mat-icon>
                            </div>
                            <input type="text"
                                class="searchbar w-full pl-10 pr-4 py-2 border shadow-md text-sm font-normal
                                        border-green rounded-10 focus:outline-none focus:ring-2
                                        focus:ring-green-500 focus:border-text"
                                placeholder="Search " />
                        </div>
                        <div
                            class="table-buttons flex w-[30%] item-center gap-x-4">
                            <button
                                class="button-gold px-4  pl-2 pr-5        flex items-center  ">
                                <mat-icon class="text-lg">add</mat-icon>
                                <span class="!text-white">Add</span>
                            </button>

                        </div>
                    </div>

                    <app-table-landscape [labels]="headers"
                        [data]="dtr_data">
                        <ng-container>
                            <ng-template #actions let-default
                                let-index="index">
                                <div
                                    class="flex items-center py-2 ">
                                    <button
                                        class="text-green hover:text-opacity-80 font-bold text-sm"
                                        (click)="view_data(default);">
                                        View
                                    </button>
                                </div>
                            </ng-template>
                        </ng-container>
                    </app-table-landscape>

                </div>
            </div>
        </div>
    </div>

</div>
